name: Release CI
on:
  push:
    branches:
      - main
      - stable
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+.x'

permissions:
  id-token: write  # Required for OIDC
  contents: write  # For Semantic Release tagging

jobs:
  release:
    name: Release
    # This template does not itself publish.  Copies made from it do, as soon
    # as they have credentials, with no change to this file.
    if: github.repository != 'openedx/frontend-template-application'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Release to npm/Github
        run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.OPENEDX_SEMANTIC_RELEASE_GITHUB_TOKEN }}
